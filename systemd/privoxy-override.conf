[Unit]
Description=Privoxy - HTTP Proxy (SOCKS5 to HTTP conversion)
After=xray-client.service network-online.target
Requires=xray-client.service
Wants=network-online.target

[Service]
# 自动重启配置
Restart=always
RestartSec=15

# 防止无限重启
StartLimitBurst=5
StartLimitIntervalSec=300

# 资源限制
MemoryLimit=256M
TasksMax=128

[Install]
WantedBy=multi-user.target
